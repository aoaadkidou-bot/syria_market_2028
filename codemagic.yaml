workflows:
  default-workflow:
    name: Syria Market Build
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Clean and get Flutter packages
        script: |
          flutter clean
          flutter pub get
      - name: Build APK for Android
        script: |
          flutter build apk --debug --no-tree-shake-icons --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
